upstream lectionseller_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tracerxbrhd.ru www.tracerxbrhd.ru api.tracerxbrhd.ru;

    client_max_body_size 100m;

    access_log /var/log/nginx/lectionseller.access.log;
    error_log /var/log/nginx/lectionseller.error.log;

    location / {
        proxy_pass http://lectionseller_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
