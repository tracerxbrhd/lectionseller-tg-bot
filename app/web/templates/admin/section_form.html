{% extends "admin/base.html" %}
{% block title %}{{ "Редактировать раздел" if section else "Новый раздел" }}{% endblock %}
{% block content %}
<h1>{{ "Редактировать раздел" if section else "Новый раздел" }}</h1>
<form class="panel" method="post" action="{{ '/admin/sections/' ~ section.id if section else '/admin/sections' }}">
  <label>Название
    <input name="title" value="{{ section.title if section else '' }}" required>
  </label>
  <label>Описание
    <textarea name="description">{{ section.description if section and section.description else '' }}</textarea>
  </label>
  <label>Порядок сортировки
    <input name="sort_order" type="number" value="{{ section.sort_order if section else 0 }}">
  </label>
  <label class="checkbox">
    <input name="is_active" type="checkbox" value="true" {% if not section or section.is_active %}checked{% endif %}>
    Активен
  </label>
  <div class="actions">
    <button type="submit">Сохранить</button>
    <a class="button secondary" href="/admin/sections">Назад</a>
  </div>
</form>
{% endblock %}
